apiVersion: apps/v1
kind: Deployment
metadata:
  name: pawonee-backend
  labels:
    app: pawonee-backend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: pawonee-backend
  template:
    metadata:
      labels:
        app: pawonee-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/coding-skuy/pawonee-backend-service:0.1.0
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pawonee-db
                  key: url
            - name: JWT_RAHASIA
              valueFrom:
                secretKeyRef:
                  name: pawonee-app
                  key: jwt-rahasia
            - name: PEDAREE_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: pawonee-app
                  key: pedaree-base-url
                  optional: true
            - name: PEDAREE_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: pawonee-app
                  key: pedaree-service-key
                  optional: true
          readinessProbe:
            httpGet:
              path: /v1/kesehatan
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/kesehatan
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pawonee-backend
spec:
  selector:
    app: pawonee-backend
  ports:
    - port: 80
      targetPort: 8080
