# TEMPLAT. Jangan isi nilai nyata di berkas ini dan jangan commit hasilnya.
# Buat secret nyata dengan kubectl (tidak menyentuh git), contoh di docs/runbook/rotasi-secret.md:
#   kubectl -n pawonee create secret generic pawonee-db  --from-literal=url=... --from-literal=password=...
#   kubectl -n pawonee create secret generic pawonee-app --from-literal=jwt-rahasia=... \
#     --from-literal=pedaree-base-url=... --from-literal=pedaree-service-key=...
apiVersion: v1
kind: Secret
metadata:
  name: pawonee-db
type: Opaque
stringData:
  url: postgres://pawonee:GANTI_PASSWORD_DB@pawonee-db:5432/pawonee
  password: GANTI_PASSWORD_DB
---
apiVersion: v1
kind: Secret
metadata:
  name: pawonee-app
type: Opaque
stringData:
  jwt-rahasia: GANTI_ACAK_MINIMAL_32_KARAKTER_XXXXXXXX
  pedaree-base-url: https://pedaree-api.GANTI.example
  pedaree-service-key: GANTI_SERVICE_KEY_PEDAREE
