apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pawonee-db
spec:
  serviceName: pawonee-db
  replicas: 1
  selector:
    matchLabels:
      app: pawonee-db
  template:
    metadata:
      labels:
        app: pawonee-db
    spec:
      containers:
        - name: postgres
          image: postgres:16.4
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: pawonee
            - name: POSTGRES_USER
              value: pawonee
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pawonee-db
                  key: password
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "pawonee", "-d", "pawonee"]
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pawonee-db
spec:
  clusterIP: None
  selector:
    app: pawonee-db
  ports:
    - port: 5432
