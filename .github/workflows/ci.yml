name: ci

# QA gate Pawonee (PWN-OPS-002). Job `qa-gate` adalah satu-satunya status yang
# diwajibkan untuk rilis: merah bila salah satu jalur merah (QA-002), tanpa skip.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref_backend:
        type: string
        default: main
      ref_pipeline:
        type: string
        default: main
      ref_ai_models:
        type: string
        default: main
      ref_web:
        type: string
        default: main
      ref_app:
        type: string
        default: main
  workflow_dispatch:
    inputs:
      ref_backend:
        description: Branch/tag pawonee-backend-service (mis. feat/pwn-be-004-endpoint-v1)
        default: main
      ref_pipeline:
        description: Branch/tag pawonee-data-pipeline
        default: main
      ref_ai_models:
        description: Branch/tag pawonee-ai-models
        default: main
      ref_web:
        description: Branch/tag pawonee-web
        default: main
      ref_app:
        description: Branch/tag pawonee-app-kmp
        default: main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Token baca lintas repo; jatuh ke GITHUB_TOKEN bila repo lain publik.
  CROSS_TOKEN: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
  E2E_TELEMETRY_DISABLED: "1"

jobs:
  skrip-ci:
    name: uji skrip gerbang (shellcheck + merah-hijau)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/ci/*.sh
      - run: bash scripts/ci/cek-bank-12.test.sh

  bank-resep:
    name: evaluasi bank resep 12/12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Coding-Skuy/pawonee-ai-models
          ref: ${{ inputs.ref_ai_models || 'main' }}
          path: ai-models
          token: ${{ env.CROSS_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: ai-models/eval/requirements.txt
      - run: pip install -r ai-models/eval/requirements.txt
      - name: Gerbang 12/12 (bukan kurang, bukan lebih)
        run: scripts/ci/cek-bank-12.sh ai-models | tee bukti-eval.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bukti-eval-bank
          path: bukti-eval.txt

  backend:
    name: cargo test (backend-service)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: pawonee
          POSTGRES_USER: pawonee
          POSTGRES_PASSWORD: ci-saja-bukan-rahasia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pawonee -d pawonee"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # #[sqlx::test] membuat DB uji sementara memakai URL ini (DB logis pawonee, hanya CI).
      DATABASE_URL: postgres://pawonee:ci-saja-bukan-rahasia@localhost:5432/pawonee
      JWT_RAHASIA: ci-saja-bukan-rahasia-minimal-32-karakter
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Coding-Skuy/pawonee-backend-service
          ref: ${{ inputs.ref_backend || 'main' }}
          path: backend
          token: ${{ env.CROSS_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo test --manifest-path backend/Cargo.toml
      - name: Cakupan (QA-004, dilaporkan, belum menggagalkan build)
        continue-on-error: true
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Ringkasan cakupan
        continue-on-error: true
        run: |
          rustup component add llvm-tools-preview
          {
            echo '### Cakupan backend (cargo llvm-cov)'
            echo '```'
            cargo llvm-cov --manifest-path backend/Cargo.toml --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  pipeline:
    name: pytest (data-pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Coding-Skuy/pawonee-data-pipeline
          ref: ${{ inputs.ref_pipeline || 'main' }}
          path: pipeline
          token: ${{ env.CROSS_TOKEN }}
      - name: Deteksi suite uji
        id: ada
        run: |
          if [ -d pipeline/tests ] && [ -f pipeline/requirements-dev.txt ]; then
            echo "uji=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=pipeline::ref ini belum memiliki tests/ + requirements-dev.txt (PWN-DATA-002..004 belum merge); job tidak menguji apa pun."
            echo "uji=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ada.outputs.uji == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
      - if: steps.ada.outputs.uji == 'true'
        run: |
          pip install -r pipeline/requirements.txt -r pipeline/requirements-dev.txt
          cd pipeline && python -m pytest -q

  web:
    name: bun install + uji (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Coding-Skuy/pawonee-web
          ref: ${{ inputs.ref_web || 'main' }}
          path: web
          token: ${{ env.CROSS_TOKEN }}
      - name: Deteksi proyek Bun/SvelteKit
        id: ada
        run: |
          if ls web/svelte.config.* >/dev/null 2>&1 && [ -f web/package.json ]; then
            echo "bun=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=web::ref ini masih Next.js 15 (drift, migrasi PWN-WEB-005/M-008); tidak ada uji Bun yang dijalankan."
            echo "bun=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ada.outputs.bun == 'true'
        uses: oven-sh/setup-bun@v2
      - if: steps.ada.outputs.bun == 'true'
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run test

  apk-kmp:
    name: build APK KMP + uji
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Coding-Skuy/pawonee-app-kmp
          ref: ${{ inputs.ref_app || 'main' }}
          path: app
          token: ${{ env.CROSS_TOKEN }}
      - name: Deteksi Gradle wrapper
        id: ada
        run: |
          if [ -x app/gradlew ]; then
            echo "gradle=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=apk-kmp::ref ini belum punya gradlew; build APK belum bisa dijalankan."
            echo "gradle=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ada.outputs.gradle == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - if: steps.ada.outputs.gradle == 'true'
        uses: gradle/actions/setup-gradle@v4
      - if: steps.ada.outputs.gradle == 'true'
        working-directory: app
        run: ./gradlew --no-daemon test assembleDebug
      - if: steps.ada.outputs.gradle == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug-${{ github.sha }}
          path: app/composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  qa-gate:
    name: qa-gate (wajib hijau untuk rilis)
    if: always()
    needs: [skrip-ci, bank-resep, backend, pipeline, web, apk-kmp]
    runs-on: ubuntu-latest
    steps:
      - name: Semua jalur harus sukses
        env:
          HASIL: ${{ toJSON(needs) }}
        run: |
          echo "$HASIL" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$HASIL" | jq -e '[.[].result] | all(. == "success")' >/dev/null; then
            echo "QA gate hijau."
          else
            echo "QA gate MERAH: rilis diblokir (QA-002)." >&2
            exit 1
          fi
