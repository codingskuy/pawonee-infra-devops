name: rotasi-secret

# Pengingat rotasi service key 90 hari (AGENTS aturan 9). Cron tidak bisa "90 hari",
# jadi dicek tiap Senin terhadap docs/runbook/rotasi-terakhir.txt; merah bila > 90 hari.
on:
  schedule:
    - cron: "0 1 * * 1"
  pull_request:
    paths:
      - "docs/runbook/rotasi-terakhir.txt"
      - "scripts/ops/**"
      - ".github/workflows/rotasi-secret.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/ops/*.sh
      - run: bash scripts/ops/cek-rotasi.test.sh
      - run: scripts/ops/cek-rotasi.sh docs/runbook/rotasi-terakhir.txt
